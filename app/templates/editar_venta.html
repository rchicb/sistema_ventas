<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/mobile-forms.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Distribuidora CHB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav me-auto flex-column flex-lg-row">
                    <a class="nav-link" href="/">Dashboard</a>
                    <a class="nav-link" href="/ventas">Registrar ventas</a>
                    <a class="nav-link" href="/formularios">Administración y Catálogos</a>
                </div>
                <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-2 gap-lg-3 text-white">
                    <span>{{ usuario["username"] }} · Administrador</span>
                    <form action="/logout" method="POST"><button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button></form>
                </div>
            </div>
        </div>
    </nav>
    <main class="container mb-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Modificar venta #{{ venta[0] }}</h5>
            </div>
            <div class="card-body">
                <form action="/ventas/{{ venta[0] }}/modificar" method="POST">
                    <input type="hidden" name="reporte_fecha" value="{{ filtros_reporte.fecha }}">
                    <input type="hidden" name="reporte_mes" value="{{ filtros_reporte.mes }}">
                    <input type="hidden" name="reporte_fecha_inicio" value="{{ filtros_reporte.fecha_inicio }}">
                    <input type="hidden" name="reporte_fecha_fin" value="{{ filtros_reporte.fecha_fin }}">
                    <input type="hidden" name="reporte_todos" value="{{ 'true' if filtros_reporte.todos else 'false' }}">
                    {% if filtros_reporte.vendedor_id %}
                    <input type="hidden" name="reporte_vendedor_id" value="{{ filtros_reporte.vendedor_id }}">
                    {% endif %}
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="vendedor_id" class="form-label">Vendedor</label>
                            <select id="vendedor_id" name="vendedor_id" class="form-select" required>
                                {% for vendedor in vendedores %}
                                <option value="{{ vendedor[0] }}" {% if vendedor[0] == venta[1] %}selected{% endif %}>{{ vendedor[2] }} - {{ vendedor[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="segundo_vendedor_id" class="form-label">Segundo vendedor (opcional)</label>
                            <select id="segundo_vendedor_id" name="segundo_vendedor_id" class="form-select">
                                <option value="">Sin segundo vendedor</option>
                                {% for vendedor in vendedores_secundarios %}
                                <option value="{{ vendedor[0] }}" {% if vendedor[0] == segundo_vendedor_id %}selected{% endif %}>{{ vendedor[2] }} - {{ vendedor[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="sucursal_id" class="form-label">Sucursal</label>
                            <select id="sucursal_id" name="sucursal_id" class="form-select" required>
                                {% for sucursal in sucursales %}
                                <option value="{{ sucursal[0] }}" {% if sucursal[0] == venta[2] %}selected{% endif %}>{{ sucursal[1] }} - {{ sucursal[2] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="base_price_id" class="form-label">Producto y talla</label>
                            <select id="base_price_id" name="base_price_id" class="form-select" required>
                                {% for producto in productos %}
                                <option value="{{ producto[0] }}"
                                        data-product-id="{{ producto[1] }}"
                                        data-base="{{ producto[6] }}"
                                        {% if producto[0] == venta[9] %}selected{% endif %}>
                                    {{ producto[3] }} · [{{ producto[9] }}]{% if producto[5] %} · {{ producto[5] }}{% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="color_id" class="form-label">Color</label>
                            <select id="color_id" name="color_id" class="form-select"></select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input id="fecha" name="fecha" type="date" class="form-control" value="{{ venta[10].isoformat() }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="numero_vendido" class="form-label">Número vendido</label>
                            <input id="numero_vendido" name="numero_vendido" type="number" min="0" step="0.01" class="form-control" value="{{ venta[5] }}" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="precio_base" class="form-label">Costo base (GTQ)</label>
                            <input id="precio_base" name="precio_base" type="number" min="0.01" step="0.01" class="form-control" value="{{ '%.2f'|format(venta[6]) }}" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="precio_vendido" class="form-label">Precio de venta (GTQ)</label>
                            <input id="precio_vendido" name="precio_vendido" type="number" min="0.01" step="0.01" class="form-control" value="{{ '%.2f'|format(venta[7]) }}" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="comision_vendedor" class="form-label">Comisión primer vendedor (GTQ)</label>
                            <select id="comision_vendedor" name="comision_vendedor" class="form-select" required>
                                {% for comision in (0, 2, 3, 5, 10, 15, 20) %}
                                <option value="{{ comision }}" {% if comisiones_por_vendedor.get(venta[1], 0) == comision %}selected{% endif %}>GTQ {{ comision }}{% if comision == 0 %} (Sin comisión){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="comision_segundo_vendedor" class="form-label">Comisión segundo vendedor (GTQ)</label>
                            <select id="comision_segundo_vendedor" name="comision_segundo_vendedor"
                                    class="form-select"
                                   {% if not segundo_vendedor_id %}disabled{% endif %}>
                                {% for comision in (0, 2, 3, 5, 10, 15, 20) %}
                                <option value="{{ comision }}" {% if (comisiones_por_vendedor.get(segundo_vendedor_id, 0) if segundo_vendedor_id else 0) == comision %}selected{% endif %}>GTQ {{ comision }}{% if comision == 0 %} (Sin comisión){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a href="{{ url_retorno }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/action-feedback.js"></script>
    <script>
        const coloresPorProducto = {{ colores_por_producto | tojson }};
        const productoSelect = document.getElementById("base_price_id");
        const colorSelect = document.getElementById("color_id");
        const costoBase = document.getElementById("precio_base");
        const colorActual = "{{ venta[4] or '' }}";
        const segundoVendedorSelect = document.getElementById("segundo_vendedor_id");
        const segundaComisionInput = document.getElementById("comision_segundo_vendedor");

        segundoVendedorSelect.addEventListener("change", function () {
            segundaComisionInput.disabled = !this.value;
            if (!this.value) segundaComisionInput.value = "0";
        });

        function actualizarColores(preservarColor) {
            const option = productoSelect.options[productoSelect.selectedIndex];
            const productId = option ? option.getAttribute("data-product-id") : null;
            const colores = productId ? coloresPorProducto[productId] || [] : [];
            colorSelect.replaceChildren();

            const opcionVacia = document.createElement("option");
            opcionVacia.value = "";
            opcionVacia.textContent = colores.length ? "Seleccione un color" : "Sin colores asignados";
            colorSelect.append(opcionVacia);
            colores.forEach(color => {
                const opcion = document.createElement("option");
                opcion.value = color.id;
                opcion.textContent = color.name;
                colorSelect.append(opcion);
            });

            const colorDeseado = preservarColor ? colorActual : "";
            if (colores.some(color => String(color.id) === colorDeseado)) {
                colorSelect.value = colorDeseado;
            }
            colorSelect.required = colores.length > 0;
            colorSelect.disabled = colores.length === 0;
        }

        productoSelect.addEventListener("change", function () {
            const option = this.options[this.selectedIndex];
            if (option) costoBase.value = Number(option.getAttribute("data-base")).toFixed(2);
            actualizarColores(false);
        });

        actualizarColores(true);
    </script>
</body>
</html>
