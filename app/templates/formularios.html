<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración e Ingresos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Sistema Ventas (SOLID)</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/formularios">Administración y Catálogos</a>
            </div>
        </div>
    </nav>
    <div class="container mb-5">
        <div class="row g-4">
            <!-- Registrar Venta -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Ingresar Nueva Venta</h5>
                    </div>
                    <div class="card-body">
                        <form action="/ventas/registrar" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Seleccionar Vendedor</label>
                                <select name="vendedor_id" class="form-select" required>
                                    {% for v in vendedores %}
                                    <option value="{{ v[0] }}">{{ v[0] }} - {{ v[1] }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Seleccionar Producto / Código / Talla Base</label>
                                <select id="producto_select" name="producto_id" class="form-select" required onchange="calcularSugeridos()">
                                    {% for p in productos %}
                                    <option value="{{ p[0] }}" data-base="{{ p[4] }}">{{ p[1] }} (Cod: {{ p[2] }}) - Talla: {{ p[3] }} [Costo Base: ${{ p[4] }}]</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Comisión Vendedor (%)</label>
                                    <select name="porcentaje_ganancia" class="form-select" required>
                                        <option value="5">5 %</option>
                                        <option value="10">10 %</option>
                                        <option value="15">15 %</option>
                                        <option value="20">20 %</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Precio Final Vendido ($)</label>
                                    <input type="number" step="0.01" name="precio_vendido" id="precio_vendido" class="form-select" placeholder="Monto cobrado" required>
                                </div>
                            </div>
                            <div class="p-3 bg-light rounded mb-3">
                                <small class="text-muted d-block mb-1">Guía de Precios Sugeridos Comerciales:</small>
                                <div class="d-flex justify-content-between flex-wrap gap-2 text-dark font-monospace" style="font-size: 0.85rem;">
                                    <span id="sug_10">10%: $0</span>
                                    <span id="sug_13">13%: $0</span>
                                    <span id="sug_15">15%: $0</span>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Registrar Venta</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Catálogos rápidos (Acordeón Responsivo) -->
            <div class="col-12 col-lg-6">
                <div class="accordion shadow-sm" id="catalogosAccordion">
                    <!-- Productos -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseProd">
                                Agregar Producto al Catálogo
                            </button>
                        </h2>
                        <div id="collapseProd" class="accordion-collapse collapse show" data-bs-parent="#catalogosAccordion">
                            <div class="accordion-body">
                                <form action="/productos/agregar" method="POST">
                                    <div class="mb-2"><input type="text" name="empresa" class="form-control" placeholder="Marca (ej. Kanguro)" required></div>
                                    <div class="mb-2"><input type="text" name="codigo" class="form-control" placeholder="Código de Producto" required></div>
                                    <div class="mb-2">
                                        <select name="talla_letra" class="form-select" required>
                                            {% for t in tallas %}
                                            <option value="{{ t[0] }}">Categoría {{ t[0] }} ({{ t[1] }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="mb-2"><input type="number" step="0.01" name="precio_base" class="form-control" placeholder="Precio Costo Base ($)" required></div>
                                    <button type="submit" class="btn btn-dark btn-sm w-100">Guardar Producto</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- Vendedores -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseVend">
                                Registrar Nuevo Vendedor
                            </button>
                        </h2>
                        <div id="collapseVend" class="accordion-collapse collapse" data-bs-parent="#catalogosAccordion">
                            <div class="accordion-body">
                                <form action="/vendedores/agregar" method="POST">
                                    <div class="mb-2"><input type="number" name="id" class="form-control" placeholder="ID de Vendedor (Int)" required></div>
                                    <div class="mb-2"><input type="text" name="nombre" class="form-control" placeholder="Nombre Completo" required></div>
                                    <button type="submit" class="btn btn-dark btn-sm w-100">Guardar Vendedor</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- Categorías -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTalla">
                                Crear Nueva Categoría de Talla
                            </button>
                        </h2>
                        <div id="collapseTalla" class="accordion-collapse collapse" data-bs-parent="#catalogosAccordion">
                            <div class="accordion-body">
                                <form action="/tallas/agregar" method="POST">
                                    <div class="mb-2"><input type="text" name="letra" maxlength="1" class="form-control" placeholder="Letra (ej. L)" required></div>
                                    <div class="mb-2"><input type="text" name="rango" class="form-control" placeholder="Rango Numérico (ej. 42 - 46)" required></div>
                                    <button type="submit" class="btn btn-dark btn-sm w-100">Guardar Talla</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function calcularSugeridos() {
            var select = document.getElementById("producto_select");
            var option = select.options[select.selectedIndex];
            var base = parseFloat(option.getAttribute("data-base")) || 0;
            
            document.getElementById("sug_10").innerText = "10%: $" + (base * 1.10).toFixed(2);
            document.getElementById("sug_13").innerText = "13%: $" + (base * 1.13).toFixed(2);
            document.getElementById("sug_15").innerText = "15%: $" + (base * 1.15).toFixed(2);
        }
        window.onload = calcularSugeridos;
    </script>
</body>
</html>
