version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_ventas_solid
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_solid:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fastapi_app_solid
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - DB_HOST=db
      - APP_PORT=${APP_PORT}
    volumes:
      - ./app:/code/app
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT} --reload"  
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_solid:
